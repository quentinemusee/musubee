#
# REUSE annotations for files that do not carry their own SPDX header.
# Specification: https://reuse.software/spec-3.3/
#
# Rule: only documentation (Markdown, NOTICE) goes here. Source code (Go, TypeScript, Kotlin,
# Swift, scripts...) MUST carry its own header; scripts/license_check.py
# fails otherwise. A header inside a file takes precedence ("closest").
version = 1

[[annotations]]
path = ["**/*.md", "NOTICE"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Quentin Raimbaud"
SPDX-License-Identifier = "AGPL-3.0-or-later"
