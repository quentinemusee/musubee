# SPDX-FileCopyrightText: 2026 Quentin Raimbaud
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# REUSE annotations for files that do not carry their own SPDX header.
# Specification: https://reuse.software/spec-3.3/
#
# Rule: only documentation (Markdown, NOTICE) and generated or JSON data and
# configuration files, which cannot carry comments, go here. Source code (Go, TypeScript, Kotlin,
# Swift, scripts...) MUST carry its own header; scripts/license_check.py
# fails otherwise. A header inside a file takes precedence ("closest").
version = 1

[[annotations]]
path = ["**/*.md", "NOTICE"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Quentin Raimbaud"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Claude Code project settings, the skills lock file and npm manifests
# (JSON, no comments).
[[annotations]]
path = [".claude/settings.json", "skills-lock.json", "**/package.json", "**/package-lock.json", "scripts/license-policy.json"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Quentin Raimbaud"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Go checksum database files (generated by the go command, no comments).
[[annotations]]
path = ["**/go.sum", "go.work.sum"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Quentin Raimbaud"
SPDX-License-Identifier = "AGPL-3.0-or-later"
