# SPDX-FileCopyrightText: 2026 Quentin Raimbaud
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Repository checks: SPDX headers (REUSE 3.3), English-only content, the
# install scripts (.ps1 / .bat / .sh in dry-run mode), and the tests of all
# these checks; Go formatting, vet, lint (golangci-lint) and unit tests (race
# detector) of the core, the test infrastructure and the tooling, and pure-Go
# (no cgo) builds of the core for every target OS; the license audit of every
# Go and npm dependency (scripts/licenseaudit); the interface's tests, lint
# and build; the desktop app (Electron) with its unit and Playwright
# end-to-end tests on Linux, Windows and macOS (docs/ADR/0013-desktop-shell.md);
# and the integration tests against a real Synapse + PostgreSQL (Linux only,
# Docker). The Telegram end-to-end test has its own workflow (telegram.yml).
# Mobile tests run on an Android emulator (Linux) and an iOS simulator
# (macOS), see apps/mobile/e2e/ and docs/ADR/0007-mobile-e2e-tool.md.

name: checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Actions are pinned to a full commit SHA (tag in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-dev.txt

      - name: Install development tools
        run: python -m pip install -r scripts/requirements-dev.txt

      - name: License check (REUSE)
        run: python scripts/license_check.py

      - name: Language check (English only)
        run: python scripts/language_check.py

      - name: Shell scripts lint
        if: runner.os == 'Linux'
        run: |
          # Preinstalled on GitHub's Ubuntu runners; installed if missing
          # (for example when the workflow runs locally with act).
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version | head -2
          shellcheck scripts/*.sh apps/mobile/ios-probe/*.sh

      - name: Tests of the checks and install scripts
        run: python -m unittest discover -s scripts/tests -v

  go:
    name: Go unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: infra/go.mod
          cache-dependency-path: |
            core/go.sum
            infra/go.sum
            scripts/licenseaudit/go.sum

      - name: Formatting (gofmt)
        shell: bash
        run: |
          unformatted=$(gofmt -l core infra scripts)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: |
          go vet ./core/...
          go vet -tags=musubee_cgo_sqlite ./core/...
          go vet -tags=integration ./infra/...
          go vet -tags=telegram ./infra/...
          go vet ./scripts/licenseaudit/...

      # Configuration: .golangci.yml. Built from source with the job's Go, so
      # that golangci-lint always understands the Go version of the modules.
      - name: Lint (golangci-lint)
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-mode: goinstall
          args: ./core/... ./infra/... ./scripts/licenseaudit/...

      - name: Lint with the SQLite driver of Android (golangci-lint)
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
        run: golangci-lint run --build-tags=musubee_cgo_sqlite ./core/...

      - name: Unit tests (race detector)
        run: go test -race -count=1 ./core/... ./infra/... ./scripts/licenseaudit/...

      # The core built with -buildmode=c-shared and driven from a C program
      # (docs/ADR/0010-core-shared-library.md). Also part of the race run
      # above; run again here with -v for the size and memory measurements.
      - name: Core as a C shared library
        env:
          CGO_ENABLED: "1"
        run: go test -count=1 -v -run TestSharedLibrary ./core/ffi/

      # Android builds use github.com/mattn/go-sqlite3 instead of
      # modernc.org/sqlite (docs/ADR/0011-core-on-android.md); the
      # musubee_cgo_sqlite tag selects that driver here, so the whole core
      # is tested with both.
      - name: Unit tests with the SQLite driver of Android
        env:
          CGO_ENABLED: "1"
        run: go test -tags=musubee_cgo_sqlite -count=1 ./core/...

      # The core must stay pure Go (docs/ADR/0009-bridgev2-in-process.md):
      # building it with cgo disabled for every target fails if a cgo
      # dependency slips in. Only core/ffi, the C interface, needs cgo: it
      # has no files to build without it. Android is not in the list: it
      # uses a cgo SQLite driver (docs/ADR/0011-core-on-android.md).
      - name: Pure-Go builds of the core (no cgo)
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "0"
        run: |
          # Library packages only: the commands (core/api/apigen,
          # core/api/transportbench) are development tools, and an iOS
          # executable needs cgo to link. Listed once for the host: with
          # GOOS=ios, go list refuses a pattern that matches a command.
          packages=$(go list -f '{{if ne .Name "main"}}{{.ImportPath}}{{end}}' ./core/...)
          for target in linux/amd64 windows/amd64 darwin/arm64 ios/arm64; do
            echo "== $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build $packages
          done

  licenses:
    name: Dependency license audit (Go and npm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: infra/go.mod
          cache-dependency-path: |
            core/go.sum
            infra/go.sum
            scripts/licenseaudit/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/mobile/package-lock.json
            apps/mobile/e2e/package-lock.json
            apps/desktop/package-lock.json
            ui/package-lock.json
            scripts/transportbench/package-lock.json

      # Installed packages let the audit read license files when a package
      # declares no license.
      - name: Install npm dependencies
        run: |
          npm ci --no-audit --no-fund --ignore-scripts --prefix apps/mobile/e2e
          npm ci --no-audit --no-fund --ignore-scripts --prefix apps/mobile
          npm ci --no-audit --no-fund --ignore-scripts --prefix apps/desktop
          npm ci --no-audit --no-fund --ignore-scripts --prefix ui
          npm ci --no-audit --no-fund --ignore-scripts --prefix scripts/transportbench

      - name: License audit
        run: go run ./scripts/licenseaudit -v

  # TypeScript side of the core API contract (docs/ADR/0012): the generated
  # types type-check, and Ajv validates the shared examples and one example
  # per command and event against the schema. The Go side runs in the go
  # job, which also fails when the generated files are stale. Also the
  # interface's own tests, its lint (oxlint) and its production build.
  ui:
    name: UI tests, typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint (oxlint)
        run: npm run lint

      - name: Contract and unit tests
        run: npm test

      - name: Production build
        run: npm run build

  # The Electron app with the real core as its child process
  # (docs/ADR/0013-desktop-shell.md): unit tests of the main process (the
  # supervisor runs the real core binary), then the app built and driven by
  # Playwright. The end-to-end tests also measure the transport and the
  # core's start-up; the measurements are in the uploaded test results.
  desktop:
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            apps/desktop/package-lock.json

      # Electron's install script downloads Electron itself.
      - name: Install npm dependencies
        run: |
          npm ci --no-audit --no-fund --prefix ui
          npm ci --no-audit --no-fund --prefix apps/desktop

      - name: Type check and lint (oxlint)
        working-directory: apps/desktop
        run: |
          npm run typecheck
          npm run lint

      - name: Unit tests (with the real core)
        working-directory: apps/desktop
        run: npm test

      - name: Build (core, interface, main process)
        working-directory: apps/desktop
        run: npm run build

      # Ubuntu 24.04 forbids unprivileged user namespaces through AppArmor,
      # and Chromium's sandbox needs them. Allow them rather than run the app
      # with --no-sandbox: the tests check the sandbox.
      - name: Allow Chromium's sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: End-to-end tests (Playwright)
        working-directory: apps/desktop
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            command -v xvfb-run >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq xvfb; }
            xvfb-run --auto-servernum npm run test:e2e
          else
            npm run test:e2e
          fi

      # Measurements, and traces of failed tests.
      - name: Upload the end-to-end test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-e2e-${{ matrix.os }}
          path: apps/desktop/test-results/
          retention-days: 14
          if-no-files-found: ignore

  integration:
    name: Integration tests (Synapse + PostgreSQL)
    # Linux runners have Docker; GitHub's Windows and macOS runners cannot run
    # the Linux containers.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fail instead of skipping if Docker is missing.
      MUSUBEE_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: infra/go.mod
          cache-dependency-path: infra/go.sum

      - name: Integration tests
        run: go test -tags=integration -race -count=1 -v ./infra/...

  android:
    name: Android app (emulator API ${{ matrix.api-level }}, instrumented and Appium tests)
    strategy:
      fail-fast: false
      matrix:
        # 30: Android 11. 35: Android 15, where foreground service types are
        # enforced (ADR 0011).
        api-level: [30, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/mobile/package-lock.json
            apps/mobile/e2e/package-lock.json

      # Gradle builds the Go core for Android with the NDK (ADR 0011).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install the Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null

      - name: Install the mobile test tools and the app's npm packages
        run: |
          npm ci --no-audit --no-fund --prefix apps/mobile/e2e
          npm ci --no-audit --no-fund --prefix apps/mobile

      - name: Build the app (x86_64, for the emulator)
        working-directory: apps/mobile/android
        run: |
          (cd .. && npx cap sync android)
          ./gradlew --no-daemon -Pmusubee.abis=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest

      # Hardware acceleration for the emulator on Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Each script line runs in its own shell, from working-directory. When
      # a line fails, it prints the crash log and the core's runtime errors
      # (the Go runtime writes them to logcat under the tag "Go") before
      # failing the step.
      - name: Tests on the emulator (hello, instrumented, app end to end)
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          working-directory: apps/mobile/e2e
          script: |
            MUSUBEE_ANDROID_UDID=emulator-5554 npm run test:android || { adb logcat -d -b crash; adb logcat -d -t 300; exit 1; }
            cd ../android && ANDROID_SERIAL=emulator-5554 ./gradlew --no-daemon -Pmusubee.abis=x86_64 :app:connectedDebugAndroidTest || { adb logcat -d -b crash; adb logcat -d -s Go:* DEBUG:* AndroidRuntime:* libc:* TestRunner:* MusubeeCore:*; exit 1; }
            MUSUBEE_ANDROID_UDID=emulator-5554 npm run test:android:app || { adb logcat -d -b crash; adb logcat -d -t 300; exit 1; }

  ios:
    name: iOS hello test (simulator, Appium)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mobile/e2e/package-lock.json

      - name: Install the mobile test tools
        working-directory: apps/mobile/e2e
        run: npm ci --no-audit --no-fund

      - name: Boot an iPhone simulator
        id: simulator
        run: |
          xcodebuild -version
          udid=$(xcrun simctl list devices available --json             | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "no available iPhone simulator"; xcrun simctl list devices available; exit 1
          fi
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # The first session builds WebDriverAgent with Xcode (several minutes).
      - name: Hello test on the simulator
        working-directory: apps/mobile/e2e
        env:
          MUSUBEE_IOS_UDID: ${{ steps.simulator.outputs.udid }}
        run: npm run test:ios

  # T1.7 (docs/ADR/0015-ios-nse-memory.md): the memory probe built for iOS
  # and run on the simulator, once per SQLite driver: in bare processes next
  # to an empty C program, and in the probe app (run-simulator.sh). The
  # simulator enforces no memory limit: the figures show what the code
  # costs, not whether it fits.
  ios-memory:
    name: iOS memory probe (simulator, SQLite ${{ matrix.sqlite }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - sqlite: modernc
            tags: ""
          - sqlite: mattn
            tags: musubee_cgo_sqlite
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      # XcodeGen (MIT) generates the Xcode project; pinned by version and
      # by the SHA-256 that GitHub publishes for the release asset.
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Probe on the Mac (for comparison)
        working-directory: core
        run: go run -tags="${{ matrix.tags }}" ./cmd/memprobe -data-dir "$RUNNER_TEMP/macprobe" -core -crypto

      - name: Build the probe for iOS (XCFramework)
        run: apps/mobile/ios-probe/build-go-xcframework.sh ./cmd/memprobe core/cmd/memprobe/memprobe.h MusubeeMemProbe apps/mobile/ios-probe/build "${{ matrix.tags }}"

      - name: Boot an iPhone simulator
        id: simulator
        run: |
          xcodebuild -version
          udid=$(xcrun simctl list devices available --json             | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "no available iPhone simulator"; xcrun simctl list devices available; exit 1
          fi
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Probe in bare processes and in the app (simulator)
        run: |
          apps/mobile/ios-probe/run-simulator.sh "${{ steps.simulator.outputs.udid }}" "$RUNNER_TEMP/ios-memory" "${{ matrix.tags }}"
          cat "$RUNNER_TEMP/ios-memory/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-memory-${{ matrix.sqlite }}
          path: ${{ runner.temp }}/ios-memory/
          if-no-files-found: ignore
