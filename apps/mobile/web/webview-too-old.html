<!-- Shown instead of the interface when the system web view is older than
     capacitor.config.json's android.minWebViewVersion (docs/ADR/0021). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'" />
    <title>Musubee</title>
  </head>
  <body>
    <h1>Update Android System WebView</h1>
    <p>Musubee shows its interface with Android System WebView, and the one on this device is too old for it.</p>
    <p>Update Android System WebView (or Google Chrome) from the Play Store, then open Musubee again.</p>
  </body>
</html>
