#
# Overlay for compose.test.yml: adds the mautrix-telegram bridge. In the tests
# it only logs in as a dedicated test bot (ADR 0005). Used with:
#   docker compose -f compose.test.yml -f compose.telegram.yml ...
# which infra/testenv does when the Telegram option is enabled.
#
# MUSUBEE_TEST_TELEGRAM_DIR must point to a directory holding config.yaml,
# registration.yaml and synapse-config/, generated per run by infra/testenv.

services:
  synapse:
    volumes:
      # Replaces the base /config mount (Compose merges volumes by target):
      # infra/testenv copies infra/synapse/ there and adds the appservice
      # fragment (telegram/synapse-appservice.yaml).
      - ${MUSUBEE_TEST_TELEGRAM_DIR:?set MUSUBEE_TEST_TELEGRAM_DIR}/synapse-config:/config:ro
      - ${MUSUBEE_TEST_TELEGRAM_DIR:?set MUSUBEE_TEST_TELEGRAM_DIR}/registration.yaml:/appservices/telegram.yaml:ro

  telegram:
    # Official image (AGPL-3.0-or-later), pinned by digest.
    image: dock.mau.dev/mautrix/telegram:v0.2609.0@sha256:03e79bcf076da566a9984b0bc06151acbf71e3df9cd2e291142713ad9ebff980
    # The image's start script lets the bridge rewrite its config file,
    # which fails on Docker Desktop bind mounts: run the binary directly,
    # without config updates.
    entrypoint: ["/usr/bin/mautrix-telegram"]
    command: ["--config", "/data/config.yaml", "--no-update"]
    # The bridge checks the homeserver at startup; Synapse only needs the
    # registration file, which exists before "up".
    depends_on:
      synapse:
        condition: service_healthy
    volumes:
      - ${MUSUBEE_TEST_TELEGRAM_DIR:?set MUSUBEE_TEST_TELEGRAM_DIR}:/data
    # The provisioning API (used by the tests to log in) on a random
    # localhost port.
    ports:
      - "127.0.0.1::29317"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:29317/_matrix/mau/live || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s
