import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// The Go core (core/ at the root of the repository) is built by this file,
// with the C compiler of the NDK below, so that "gradlew assemble" needs
// nothing prepared beforehand: Go 1.27.1 or later in PATH (or the Gradle
// property musubee.go), the Android SDK and this NDK.
def repoRoot = rootProject.projectDir.parentFile.parentFile.parentFile
def coreDir = new File(repoRoot, 'core')
def ndkVersionUsed = '28.2.13676358'
// Android ABI -> Go architecture and NDK target triple.
def coreAbis = [
    'arm64-v8a': [goarch: 'arm64', triple: 'aarch64-linux-android'],
    'x86_64'   : [goarch: 'amd64', triple: 'x86_64-linux-android'],
    'x86'      : [goarch: '386', triple: 'i686-linux-android'],
]
// -Pmusubee.abis=x86_64 builds fewer ABIs (faster local builds, CI).
def selectedAbis = (findProperty('musubee.abis') ?: coreAbis.keySet().join(',')).split(',').collect { it.trim() }
def goCommand = findProperty('musubee.go') ?: 'go'
// The Telegram application credentials (https://my.telegram.org), from the
// environment of the build, never from the repository: like every Telegram
// client, the app carries them (docs/ADR/0014). Without them, the core does
// not offer Telegram.
def telegramApiId = (findProperty('musubee.telegramApiId') ?: System.getenv('MUSUBEE_TG_API_ID') ?: '0').toString()
def telegramApiHash = (findProperty('musubee.telegramApiHash') ?: System.getenv('MUSUBEE_TG_API_HASH') ?: '').toString()
if (!telegramApiId.isInteger() || !(telegramApiHash ==~ /[0-9a-f]*/)) {
    throw new GradleException('MUSUBEE_TG_API_ID must be a number and MUSUBEE_TG_API_HASH hexadecimal')
}
// Signal (docs/ADR/0029): off unless musubee.signal names Signal's service,
// "staging" or "production". The core then needs libsignal-ffi, built per
// ABI by scripts/build-libsignal.sh into musubee.libsignal/<abi>.
def signalEnvironment = (findProperty('musubee.signal') ?: '').toString()
if (!(signalEnvironment in ['', 'staging', 'production'])) {
    throw new GradleException('musubee.signal must be staging or production')
}
def libsignalDir = findProperty('musubee.libsignal') ? file(findProperty('musubee.libsignal')) : null
if (signalEnvironment && libsignalDir == null) {
    throw new GradleException('musubee.signal needs musubee.libsignal, the directory of scripts/build-libsignal.sh DIR/<abi> <abi>')
}
def coreMinSdk = rootProject.ext.minSdkVersion

android {
    namespace = "app.musubee"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion = ndkVersionUsed
    defaultConfig {
        applicationId "app.musubee"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "int", "TELEGRAM_API_ID", telegramApiId
        buildConfigField "String", "TELEGRAM_API_HASH", "\"${telegramApiHash}\""
        buildConfigField "String", "SIGNAL_ENVIRONMENT", "\"${signalEnvironment}\""
        ndk {
            abiFilters(*selectedAbis)
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // The core: the C shared library of core/ffi with its JNI entry points
    // (docs/ADR/0011), built below.
    sourceSets {
        main {
            jniLibs.srcDir layout.buildDirectory.dir('musubee-core/jniLibs')
        }
    }
    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        jniLibs {
            // The Go library is stripped at link time (-s -w).
            keepDebugSymbols += ['**/libmusubee.so']
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

def ndkToolchainBin = {
    def host = org.gradle.internal.os.OperatingSystem.current()
    def tag = host.isWindows() ? 'windows-x86_64' : host.isMacOsX() ? 'darwin-x86_64' : 'linux-x86_64'
    new File(android.ndkDirectory, "toolchains/llvm/prebuilt/${tag}/bin")
}
// Go's C compiler. On Windows, clang.exe with the target rather than the
// NDK's .cmd wrapper: cmd.exe limits a command line to 8191 characters, and
// the link of the core with Signal goes past it (docs/ADR/0028). Go splits
// CC on spaces and honours quotes.
def ndkClang = { String triple ->
    if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
        def clang = new File(ndkToolchainBin(), 'clang.exe').absolutePath.replace('\\', '/')
        return "\"${clang}\" --target=${triple}${coreMinSdk}"
    }
    new File(ndkToolchainBin(), "${triple}${coreMinSdk}-clang").absolutePath
}
def coreSources = fileTree(coreDir) {
    include '**/*.go', '**/*.c', '**/*.h', '**/*.sql', 'go.mod', 'go.sum'
    exclude '**/*_test.go', '**/testdata/**'
}

// The C shared library and its JNI entry points, one per ABI.
def buildCoreTasks = selectedAbis.collect { abi ->
    def target = coreAbis[abi]
    if (target == null) {
        throw new GradleException("Unknown ABI ${abi}; known: ${coreAbis.keySet()}")
    }
    tasks.register("buildCore-${abi}", Exec) {
        description = "Builds the Go core as libmusubee.so for ${abi}."
        def output = layout.buildDirectory.file("musubee-core/jniLibs/${abi}/libmusubee.so")
        inputs.files(coreSources)
        inputs.property('goarch', target.goarch)
        inputs.property('signal', signalEnvironment != '')
        def libsignal = signalEnvironment ? new File(libsignalDir, abi) : null
        if (libsignal != null) {
            inputs.dir(libsignal)
        }
        outputs.file(output)
        workingDir coreDir
        environment 'CGO_ENABLED', '1'
        environment 'GOOS', 'android'
        environment 'GOARCH', target.goarch
        environment 'CC', ndkClang(target.triple)
        def tags = 'goolm'
        if (libsignal != null) {
            // libsignalgo links -lsignal_ffi, and its -lstdc++ resolves to
            // the libc++.a linker script that build-libsignal.sh writes
            // there, so the C++ runtime is linked statically.
            def dir = libsignal.absolutePath.replace('\\', '/')
            environment 'CGO_LDFLAGS', "-L${dir}"
            tags += ',musubee_signal'
        }
        // goolm: mautrix-go's pure-Go Olm (docs/ADR/0018).
        commandLine goCommand, 'build', "-tags=${tags}", '-buildmode=c-shared', '-trimpath', '-ldflags=-s -w',
            '-o', output.get().asFile.absolutePath, './ffi'
        doFirst {
            if (libsignal != null && !new File(libsignal, 'libsignal_ffi.a').isFile()) {
                throw new GradleException("No libsignal_ffi.a in ${libsignal}: run scripts/build-libsignal.sh ${libsignal} ${abi}")
            }
        }
        doLast {
            // cgo also writes a C header next to the library; the app does
            // not need it in the APK.
            delete(output.get().asFile.absolutePath.replaceFirst(/\.so$/, '.h'))
        }
    }
}

// preBuild is created by the Android plugin later on: match it lazily.
tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn(buildCoreTasks)
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation project(':capacitor-android')
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test:runner:$androidxTestRunnerVersion"
    androidTestImplementation "androidx.test:rules:$androidxTestRulesVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
